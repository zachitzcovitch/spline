[workspace]
members = [
    "benchmarks",
    "crates/*",
    "examples/contract",
    "examples/blog/contracts",
    "examples/blog/server",
    "examples/blog/rust-client",
]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2021"
publish = false
license = "MIT OR Apache-2.0"
repository = "https://github.com/zachitzcovitch/spline"
readme = "README.md"

[workspace.dependencies]
spline = { path = "crates/spline" }
spline-schema = { path = "crates/spline-schema" }
spline-contract = { path = "crates/spline-contract" }
spline-macros = { path = "crates/spline-macros" }
spline-typescript = { path = "crates/spline-typescript" }
spline-http = { path = "crates/spline-http" }
axum = { version = "=0.8.9", default-features = false, features = ["http1", "json", "tokio"] }
reqwest = { version = "=0.12.28", default-features = false, features = ["json", "rustls-tls"] }
tokio = { version = "1", features = ["macros", "rt-multi-thread", "net", "sync", "time", "process"] }
percent-encoding = "2"
url = "2"
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.154"
proc-macro2 = "1"
quote = "1"
syn = { version = "=3.0.3", features = ["full", "visit"] }
serde_derive_internals = "=0.30.0"
trybuild = "1"
