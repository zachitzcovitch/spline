[package]
name = "spline-serde-internals-probe"
version = "0.0.0"
description = "Isolated evaluation of serde_derive_internals behind a private adapter"
edition = "2021"
publish = false

[dependencies]
proc-macro2 = { version = "1", features = ["span-locations"] }
quote = "1"
serde_derive_internals = "=0.30.0"
syn = { version = "=3.0.3", default-features = false, features = ["clone-impls", "derive", "parsing", "printing"] }

[dev-dependencies]
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.154"
trybuild = "1"
