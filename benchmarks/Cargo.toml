[package]
name = "splinekit-benchmarks"
version.workspace = true
edition.workspace = true
publish.workspace = true
license.workspace = true
repository.workspace = true
readme = "README.md"
description = "Metadata, exporter, and HTTP performance benchmarks for Splinekit"

[dev-dependencies]
criterion = { version = "=0.5.1", default-features = false, features = ["async_tokio", "cargo_bench_support"] }
splinekit = { workspace = true, features = ["http"] }
splinekit-example-blog-contracts = { path = "../examples/blog/contracts" }
splinekit-typescript.workspace = true
serde_json.workspace = true
tokio.workspace = true

[[bench]]
name = "metadata"
harness = false

[[bench]]
name = "http"
harness = false
