[package]
name = "spline-benchmarks"
version.workspace = true
edition.workspace = true
publish.workspace = true
license.workspace = true
repository.workspace = true
readme = "README.md"
description = "Metadata, exporter, and HTTP performance benchmarks for Spline"

[dev-dependencies]
criterion = { version = "=0.5.1", default-features = false, features = ["async_tokio", "cargo_bench_support"] }
spline = { workspace = true, features = ["http"] }
spline-example-blog-contracts = { path = "../examples/blog/contracts" }
spline-typescript.workspace = true
serde_json.workspace = true
tokio.workspace = true

[[bench]]
name = "metadata"
harness = false

[[bench]]
name = "http"
harness = false
