[package]
name = "splinekit-http"
version.workspace = true
edition.workspace = true
publish.workspace = true
license.workspace = true
repository.workspace = true
readme.workspace = true
description = "HTTP/JSON binding runtime for Splinekit, using Axum and reqwest"

[features]
default = ["client", "server"]
# The reqwest client; with only this feature the crate builds for wasm32.
client = ["dep:reqwest"]
# The Axum server.
server = ["dep:axum"]

[dependencies]
splinekit-contract.workspace = true
splinekit-http-contract.workspace = true
splinekit-runtime.workspace = true
splinekit-schema.workspace = true
splinekit-macros.workspace = true
serde.workspace = true
serde_json.workspace = true
axum = { workspace = true, optional = true }
reqwest = { workspace = true, optional = true }
http.workspace = true
percent-encoding.workspace = true
url.workspace = true

[dev-dependencies]
tokio.workspace = true
